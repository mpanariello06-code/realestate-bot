<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RealEstate Bot — Leads</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/styles.css" />
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><i class="fa-solid fa-house-chimney"></i></div>
      <div><div class="logo-text">RealEstate Bot</div><div class="logo-sub">Client Portal</div></div>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-section-label">Main</span>
      <button class="nav-item" onclick="nav('dashboard.html')"><i class="fa-solid fa-gauge-high"></i> Dashboard</button>
      <button class="nav-item" onclick="nav('listings.html')"><i class="fa-solid fa-building"></i> Listings</button>
      <button class="nav-item active" onclick="nav('leads.html')"><i class="fa-solid fa-users"></i> Leads</button>
      <button class="nav-item" onclick="nav('performance.html')"><i class="fa-solid fa-chart-line"></i> Performance</button>
      <span class="nav-section-label">Account</span>
      <button class="nav-item" onclick="nav('settings.html')"><i class="fa-solid fa-gear"></i> Settings</button>
      <button class="nav-item danger" onclick="signOut()"><i class="fa-solid fa-right-from-bracket"></i> Sign Out</button>
    </nav>
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar" id="userAvatarInitial">A</div>
        <div><div class="user-name" id="sidebarName">Agent</div><div class="user-role">Real Estate Agent</div></div>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="top-header">
      <div class="header-title"><h1>Leads Management</h1><p>Track and manage your incoming leads</p></div>
      <div class="header-actions">
        <button class="notif-btn"><i class="fa-solid fa-bell"></i><span class="notif-dot"></span></button>
      </div>
    </header>

    <div class="page-body">
      <div class="toolbar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Search by name, email, phone…" oninput="onSearch()" />
        </div>
        <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">All</button>
        <button class="filter-btn" data-filter="new" onclick="setFilter('new', this)">New</button>
        <button class="filter-btn" data-filter="qualified" onclick="setFilter('qualified', this)">Qualified</button>
        <button class="filter-btn" data-filter="unqualified" onclick="setFilter('unqualified', this)">Unqualified</button>
        <button class="filter-btn" data-filter="called" onclick="setFilter('called', this)">Called</button>
      </div>

      <div class="card" style="padding:0;overflow:hidden">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Lead</th><th>Email</th><th>Phone</th><th>Listing</th>
                <th>Platform</th><th>Score</th><th>Status</th><th>Created</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="leadsBody">
              <tr><td colspan="9" style="text-align:center;padding:40px;color:var(--text-secondary)"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="pagination" id="pagination" style="padding:16px"></div>
      </div>
    </div>
  </div>
</div>

<!-- Lead Detail Modal -->
<div class="modal-overlay" id="leadModal">
  <div class="modal modal-lg">
    <div class="modal-header">
      <span class="modal-title">Lead Details</span>
      <button class="modal-close" onclick="closeModal('leadModal')"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="leadModalBody"></div>
  </div>
</div>

<div id="toast-container"></div>
<script src="../shared/api.js"></script>
<script>
  let currentPage = 1, totalPages = 1, currentFilter = 'all', searchQuery = '';
  const PER_PAGE = 15;

  function nav(p) { window.location.href = p; }
  async function signOut() { await window.electronAPI.storeDelete('auth_token'); window.location.href = 'login.html'; }

  async function init() {
    const user = await checkAuth();
    if (!user) return;
    const name = user.full_name || user.email || 'Agent';
    document.getElementById('sidebarName').textContent = name;
    document.getElementById('userAvatarInitial').textContent = name[0].toUpperCase();
    await loadLeads();
  }

  let searchTimer;
  function onSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { searchQuery = document.getElementById('searchInput').value; currentPage = 1; loadLeads(); }, 300);
  }

  function setFilter(f, el) {
    currentFilter = f; currentPage = 1;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    loadLeads();
  }

  async function loadLeads() {
    const params = new URLSearchParams({ page: currentPage, limit: PER_PAGE });
    if (currentFilter !== 'all') params.set('status', currentFilter);
    if (searchQuery) params.set('search', searchQuery);
    const res = await apiRequest('GET', `/leads?${params}`);
    if (!res.ok) { renderLeads([], 0); return; }
    const data = res.data;
    const items = data.items || data;
    const total = data.total || items.length;
    totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
    renderLeads(items, total);
    renderPagination();
  }

  function renderLeads(leads, total) {
    const tbody = document.getElementById('leadsBody');
    if (!leads.length) {
      tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><i class="fa-solid fa-users"></i><h3>No leads found</h3><p>Try adjusting your filters or search query.</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = leads.map(l => `
      <tr>
        <td><div style="display:flex;align-items:center;gap:9px">
          <div class="avatar" style="width:30px;height:30px;font-size:12px">${(l.full_name||'?')[0]}</div>
          <div><div style="font-weight:600">${l.full_name||'—'}</div></div>
        </div></td>
        <td style="color:var(--text-secondary);font-size:12.5px">${l.email||'—'}</td>
        <td style="color:var(--text-secondary);font-size:12.5px">${l.phone||'—'}</td>
        <td style="font-size:12.5px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${l.listing_title||'—'}</td>
        <td><span style="font-size:12px;color:var(--text-secondary)"><i class="fa-brands fa-${platformIcon(l.platform)}" style="margin-right:4px"></i>${l.platform||'—'}</span></td>
        <td>
          <div class="score-bar">
            <div class="score-track"><div class="score-fill" style="width:${l.score||0}%;background:${getScoreColor(l.score||0)}"></div></div>
            <span style="font-size:12px;min-width:24px;text-align:right">${l.score||0}</span>
          </div>
        </td>
        <td>${getStatusBadge(l.status)}</td>
        <td style="font-size:12px;color:var(--text-secondary)">${formatDate(l.created_at)}</td>
        <td>
          <div style="display:flex;gap:6px">
            <button class="btn btn-outline btn-sm" onclick="viewLead('${l.id}')" title="View Details"><i class="fa-solid fa-eye"></i></button>
            <button class="btn btn-outline btn-sm" onclick="qualifyLead('${l.id}','qualified')" title="Qualify"><i class="fa-solid fa-check" style="color:var(--success)"></i></button>
            <button class="btn btn-outline btn-sm" onclick="qualifyLead('${l.id}','unqualified')" title="Disqualify"><i class="fa-solid fa-xmark" style="color:var(--danger)"></i></button>
            <button class="btn btn-outline btn-sm" onclick="triggerCall('${l.id}')" title="Trigger Call"><i class="fa-solid fa-phone" style="color:var(--accent-purple-light)"></i></button>
          </div>
        </td>
      </tr>`).join('');
  }

  function renderPagination() {
    const pag = document.getElementById('pagination');
    if (totalPages <= 1) { pag.innerHTML = ''; return; }
    let html = `<button class="page-btn" onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}><i class="fa-solid fa-chevron-left"></i></button>`;
    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 1) {
        html += `<button class="page-btn ${i===currentPage?'active':''}" onclick="goPage(${i})">${i}</button>`;
      } else if (Math.abs(i - currentPage) === 2) {
        html += `<span style="color:var(--text-secondary);padding:0 4px">…</span>`;
      }
    }
    html += `<button class="page-btn" onclick="goPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}><i class="fa-solid fa-chevron-right"></i></button>`;
    pag.innerHTML = html;
  }

  function goPage(p) { if (p < 1 || p > totalPages) return; currentPage = p; loadLeads(); }

  async function viewLead(id) {
    const res = await apiRequest('GET', `/leads/${id}`);
    if (!res.ok) { showToast('error', 'Error', 'Failed to load lead details.'); return; }
    const l = res.data;
    document.getElementById('leadModalBody').innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <div>
          <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">
            <div class="avatar" style="width:52px;height:52px;font-size:20px">${(l.full_name||'?')[0]}</div>
            <div><div style="font-size:18px;font-weight:700">${l.full_name||'—'}</div>
              <div style="color:var(--text-secondary);font-size:13px;margin-top:3px">${getStatusBadge(l.status)}</div>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px;font-size:13.5px">
            ${infoRow('fa-envelope','Email', l.email)}
            ${infoRow('fa-phone','Phone', l.phone)}
            ${infoRow('fa-globe','Platform', l.platform)}
            ${infoRow('fa-building','Listing', l.listing_title)}
            ${infoRow('fa-calendar','Created', formatDate(l.created_at))}
          </div>
        </div>
        <div>
          <div style="margin-bottom:16px">
            <div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px">LEAD SCORE</div>
            <div style="display:flex;align-items:center;gap:12px">
              <div style="font-size:32px;font-weight:800;color:${getScoreColor(l.score||0)}">${l.score||0}</div>
              <div style="flex:1;height:8px;background:var(--border);border-radius:99px">
                <div style="width:${l.score||0}%;height:100%;border-radius:99px;background:${getScoreColor(l.score||0)}"></div>
              </div>
            </div>
          </div>
          ${l.ai_notes ? `<div style="margin-bottom:16px"><div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px">AI QUALIFICATION NOTES</div><div style="background:var(--bg-secondary);border-radius:8px;padding:12px;font-size:13px;line-height:1.6;color:var(--text-secondary)">${l.ai_notes}</div></div>` : ''}
          ${l.suggested_response ? `<div><div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px">SUGGESTED RESPONSE</div><div style="background:rgba(124,58,237,0.08);border:1px solid rgba(124,58,237,0.2);border-radius:8px;padding:12px;font-size:13px;line-height:1.6">${l.suggested_response}</div></div>` : ''}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="qualifyLead('${l.id}','qualified');closeModal('leadModal')"><i class="fa-solid fa-check"></i> Qualify</button>
        <button class="btn btn-danger btn-sm" onclick="qualifyLead('${l.id}','unqualified');closeModal('leadModal')"><i class="fa-solid fa-xmark"></i> Disqualify</button>
        <button class="btn btn-primary" onclick="triggerCall('${l.id}')"><i class="fa-solid fa-phone"></i> Trigger Call</button>
      </div>`;
    openModal('leadModal');
  }

  function infoRow(icon, label, value) {
    return `<div style="display:flex;gap:10px;align-items:flex-start"><i class="fa-solid ${icon}" style="color:var(--text-secondary);width:16px;margin-top:2px;font-size:13px"></i><div><div style="color:var(--text-secondary);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em">${label}</div><div style="margin-top:1px">${value||'—'}</div></div></div>`;
  }

  async function qualifyLead(id, status) {
    const res = await apiRequest('PATCH', `/leads/${id}`, { status });
    if (res.ok) { showToast('success', 'Lead updated', `Status set to ${status}.`); loadLeads(); }
    else showToast('error', 'Error', 'Failed to update lead.');
  }

  async function triggerCall(id) {
    const res = await apiRequest('POST', `/leads/${id}/call`);
    if (res.ok) { showToast('success', 'Call triggered', 'The automated call has been initiated.'); loadLeads(); }
    else showToast('error', 'Error', 'Failed to trigger call.');
  }

  function platformIcon(p) {
    const m = { facebook:'facebook', instagram:'instagram', tiktok:'tiktok', whatsapp:'whatsapp' };
    return m[(p||'').toLowerCase()] || 'globe';
  }

  init();
</script>
</body>
</html>
