<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} – RealEstate Bot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #1a56db;
      --primary-dark: #1e40af;
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    nav {
      background: var(--primary);
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 2rem;
      height: 56px;
    }
    nav .brand { color: #fff; font-weight: 700; font-size: 1.1rem; text-decoration: none; }
    nav a { color: rgba(255,255,255,.8); text-decoration: none; font-size: .9rem; }
    nav a:hover { color: #fff; }
    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.6rem; margin-bottom: 1.5rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      text-align: center;
    }
    .stat-card .value { font-size: 2rem; font-weight: 700; color: var(--primary); }
    .stat-card .label { font-size: .8rem; color: var(--muted); margin-top: .25rem; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    th { background: var(--bg); text-align: left; padding: .6rem .75rem; font-size: .75rem; text-transform: uppercase; color: var(--muted); border-bottom: 2px solid var(--border); }
    td { padding: .6rem .75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-block; padding: .2rem .55rem; border-radius: 9999px;
      font-size: .72rem; font-weight: 600;
    }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-yellow { background: #fef3c7; color: #92400e; }
    .badge-red { background: #fee2e2; color: #991b1b; }
    .badge-gray  { background: #f3f4f6; color: #374151; }
    .btn {
      display: inline-block; padding: .45rem 1rem; border-radius: 6px;
      font-size: .85rem; font-weight: 500; cursor: pointer;
      text-decoration: none; border: none;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-sm { padding: .3rem .7rem; font-size: .78rem; }
    footer { text-align: center; padding: 2rem; color: var(--muted); font-size: .8rem; }
  </style>
</head>
<body>
  <nav>
    <a class="brand" href="/">🏠 RealEstate Bot</a>
    <a href="/dashboard">Dashboard</a>
    <a href="/leads">Leads</a>
    <a href="/connect-socials">Connect Socials</a>
  </nav>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
  <footer>RealEstate Bot &copy; 2025</footer>
</body>
</html>
